name: Release code and publish ComfyUI node

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate version and Python sources
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q __init__.py nodes.py download_model.py _vendor standalone/windows
          test "${GITHUB_REF_NAME}" = "v$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
      - name: Build code-only archives
        run: python scripts/build_release.py
      - name: Verify archive boundaries
        run: |
          python - <<'PY'
          import pathlib, zipfile
          for path in pathlib.Path('dist').glob('*.zip'):
              with zipfile.ZipFile(path) as archive:
                  assert archive.testzip() is None
                  assert not any(set(name.split('/')) & {'runtime', 'models', 'data'} for name in archive.namelist())
          PY
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Index Translate $GITHUB_REF_NAME" --notes "Chrome now adds subtitle, speech, and stop controls inside video players. The page bubble defaults to the right edge and closes its panel on outside clicks. Vimeo caption messaging is supported with local speech fallback. Pending speech starts are serialized to prevent BUSY races. First tab audio capture requires clicking the Chrome toolbar extension action; the inline controls explain missing authorization. Compatible with the 0.1.14 standalone runtime. Existing model folders are read directly without copying. Code ZIPs exclude runtimes and weights. Model files: https://huggingface.co/t8star/Index-Translate-Comfy/tree/main."

  registry:
    needs: release
    runs-on: ubuntu-latest
    env:
      REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Registry credentials
        run: test -n "$REGISTRY_ACCESS_TOKEN"
      - name: Publish to Comfy Registry
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
