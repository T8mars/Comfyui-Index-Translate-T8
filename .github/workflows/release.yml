name: Release code and publish ComfyUI node

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate version and Python sources
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q __init__.py nodes.py download_model.py _vendor standalone/windows
          test "${GITHUB_REF_NAME}" = "v$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
      - name: Build code-only archives
        run: python scripts/build_release.py
      - name: Verify archive boundaries
        run: |
          python - <<'PY'
          import pathlib, zipfile
          for path in pathlib.Path('dist').glob('*.zip'):
              with zipfile.ZipFile(path) as archive:
                  assert archive.testzip() is None
                  assert not any(set(name.split('/')) & {'runtime', 'models', 'data'} for name in archive.namelist())
          PY
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Index Translate $GITHUB_REF_NAME" --notes "R2T2 speech recognition now supports an existing model directory without copying GGUF weights. Choose the path in the standalone Models and devices panel. Chrome video capture lifecycle, translation cache settings, and full-screen subtitles are corrected. Audio mode requires the 0.1.13 or newer complete Windows runtime; code-only updates cannot add speech dependencies to older bundles. A reuse-ASR bundle is shared separately for users who already have speech weights. Index-Translate model files remain at https://huggingface.co/t8star/Index-Translate-Comfy/tree/main."

  registry:
    needs: release
    runs-on: ubuntu-latest
    env:
      REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Registry credentials
        run: test -n "$REGISTRY_ACCESS_TOKEN"
      - name: Publish to Comfy Registry
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
